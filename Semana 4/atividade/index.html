<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <title>Tags HTML – Formatação</title>
</head>

<body>

    <!-- sup = sobrescrito (fica em cima) -->
    <p>Potência: x<sup>2</sup></p>

    <!-- sub = subscrito (fica embaixo) -->
    <p>Fórmula da água: H<sub>2</sub>O</p>

    <!-- cite = título de obra -->
    <p>Livro: <cite>Dom Casmurro</cite></p>

    <!-- dfn = definição de termo -->
    <p><dfn>HTML</dfn> é uma linguagem de marcação para criar páginas web.</p>

</body>

</html>
